<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missoni x Farfetch | Valentin Lefevre</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    
    <style>
        /* 1. Base Carousel Item - Enforcing Margins & Centering */
        .project-page .carousel-item {
            top: 140px !important; 
            bottom: 30px !important;
            left: 30px !important;   /* Enforce 30px padding */
            right: 30px !important;  /* Enforce 30px padding */
            height: calc(100vh - 170px) !important;
            display: flex;
            align-items: center;     /* Vertical Center */
            justify-content: center; /* Horizontal Center */
            pointer-events: none;
            overflow: hidden; 
        }
        .project-page .carousel-item.active { pointer-events: auto; }

        /* 2. Media Styling - Consistent Sizing & Radius */
        .project-page img {
            height: 100% !important;     /* Max out height first */
            width: auto !important;      /* Width scales naturally */
            max-width: 100% !important;  /* Never overflow width */
            object-fit: contain;         /* Show full image without cropping */
            border-radius: 6px;          /* Round edges on everything */
            display: block;
            margin: 0 auto;              /* Ensure centering */
        }

        /* 3. Double Media Layout */
        .project-page .double-media {
            display: flex !important;
            flex-direction: row !important;
            gap: 15px !important; 
            height: 100% !important;
            width: auto !important;
        }
        .project-page .media-col {
            height: 100% !important;
            width: auto !important;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .project-page nav { display: flex; justify-content: space-between; align-items: center; }
        .project-page .brand-pill { text-decoration: none !important; }
    </style>
</head>
<body class="mode-traditional project-page">

    <div id="info-overlay" class="overlay">
        <button id="close-info" class="close-btn">Close</button>
        <div class="overlay-content">
            <p>
Introducing Missoni’s latest collection through a location shoot on Hampstead Heath. Starring Jess Maybury, the campaign juxtaposes Italian vibrance against a quintessentially British landscape.<br><br>
Photography by<a href="https://www.webberrepresents.com/artists/laura-jane-coulson"> Laura Jane Coulson</a>, Styling<a href="https://rep-ltd.com/artists/eliza-conlon"> Eliza Conlon</a>.

            </p>
        </div>
    </div>

    <nav>
        <div class="nav-left">
            <a href="index.html" class="brand-pill">Valentin Lefevre</a>
        </div>
        <div class="nav-right">
            <div id="open-info" class="brand-pill">Missoni x Farfetch</div>
        </div>
    </nav>

    <main class="carousel-container">
        
        <div class="carousel-nav-left" id="prev"></div>
        <div class="carousel-nav-right" id="next"></div>

        <div class="carousel-item active">
            <img src="assets/images/project07/01.jpg" alt="Slide 01">
        </div>

        <div class="carousel-item">
            <div class="double-media">
                <div class="media-col">
                    <img src="assets/images/project07/02.jpg" alt="Slide 02 Left">
                </div>
                <div class="media-col">
                    <img src="assets/images/project07/03.jpg" alt="Slide 02 Right">
                </div>
            </div>
        </div>


         <div class="carousel-item">
            <img src="assets/images/project07/04.jpg" alt="Slide 04">
        </div>

        <div class="carousel-item">
            <div class="double-media">
                <div class="media-col">
                    <img src="assets/images/project07/05.jpg" alt="Slide 03 Left">
                </div>
                <div class="media-col">
                    <img src="assets/images/project07/06.jpg" alt="Slide 03 Right">
                </div>
            </div>
        </div>

 

    </main>

    <script>
        const items = document.querySelectorAll('.carousel-item');
        let current = 0;

        function updateCarousel(index) {
            items.forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
        }

        document.getElementById('next').onclick = () => { current = (current + 1) % items.length; updateCarousel(current); };
        document.getElementById('prev').onclick = () => { current = (current - 1 + items.length) % items.length; updateCarousel(current); };

        document.getElementById('open-info').onclick = () => document.getElementById('info-overlay').classList.add('active');
        document.getElementById('close-info').onclick = () => document.getElementById('info-overlay').classList.remove('active');
    </script>
</body>
</html>
